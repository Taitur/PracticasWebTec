<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | ProyectoPruebaConexiónWeb</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/profiler.js"></script>
  </head>
  <body>
    <!--
        ruta get: http://localhost:3000/juego/:id
        body respuesta: { name, points }

        ruta put: http://localhost:3000/juego/:id
        body petición: { points }
    -->
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ProyectoPruebaConexiónWeb</div>
      </div>
      <div id="unity-player-info"></div>
      <button id="save-points-button" style="margin-top: 5px;">Guardar puntaje</button>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var API_BASE = "http://localhost:3000/juego";

      var userId = new URLSearchParams(window.location.search).get("user_id");
      var currentUserName = "";
      var currentUserPoints = 0;
      var unityInstanceRef = null;

      function renderPlayerInfo(name, points) {
        currentUserName = name;
        document.querySelector("#unity-player-info").innerText =
          "Jugador: " + name + " — Puntos: " + points;
      }

      window.updateGamePoints = function (points) {
        currentUserPoints = points;
        renderPlayerInfo(currentUserName, points);
      };

      window.saveGamePoints = async function (points) {
        if (!userId) return;
        currentUserPoints = points;
        renderPlayerInfo(currentUserName, points);
        await fetch(API_BASE + "/" + userId, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ points }),
        });
      };

      document.querySelector("#save-points-button").onclick = () => {
        if (unityInstanceRef) {
          unityInstanceRef.SendMessage("GameManager", "ReportCurrentScore");
        }
        window.saveGamePoints(currentUserPoints);
      };

      var userDataPromise = userId
        ? fetch(API_BASE + "/" + userId)
            .then((res) => (res.ok ? res.json() : null))
            .catch(() => null)
        : Promise.resolve(null);

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/JuegoUnityWebActividad.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/JuegoUnityWebActividad.data",
        frameworkUrl: buildUrl + "/JuegoUnityWebActividad.framework.js",
        codeUrl: buildUrl + "/JuegoUnityWebActividad.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ProyectoPruebaConexiónWeb",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        userDataPromise.then((userData) => {
          if (userData) {
            currentUserPoints = userData.points;
            renderPlayerInfo(userData.name, userData.points);
            config.arguments = [String(userId), String(userData.points)];
          }

        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                unityInstanceRef = unityInstance;
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

                var profile = unityProfiler.createButton(unityInstance);
                profile.style.marginLeft = '5px';
                document.querySelector("#unity-build-title").appendChild(profile);

                var quit = document.createElement("button");
                quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
                quit.innerHTML = "Unload";
                document.querySelector("#unity-build-title").appendChild(quit);
                quit.onclick = () => {
                  unityInstance.Quit().then(() => {
                    unityInstanceRef = null;
                    unityProfiler.shutDown();
                    document.querySelector("#unity-container").remove();
                    canvas = null;
                    script.remove();
                    script = null;
                  });
                };
              }).catch((message) => {
                alert(message);
              });
        });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
